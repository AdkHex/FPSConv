# 25 -> 23.976 : PAL back to NTSC film speed (a 4.096% slow-down).
#
# The inverse of film-to-pal. Note the two are NOT symmetrical in sample count:
# a round trip lands within one sample, never exactly on it, because each
# direction rounds independently.

[defaults]
preset = "25_to_23.976"
method = "resample"
atmos_policy = "refuse"

[output]
codec = "auto"
container = "auto"
template = "{stem}__a{index}__{profile}"
overwrite = "skip"
dither = "tpdf"

[decode]
drc_scale = 0.0
ignore_dialnorm = true

[verify]
pcm_md5 = true
