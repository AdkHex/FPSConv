[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpsaudio"
version = "1.0.0"
description = "Exact audio frame-rate retiming, with verification and no silent loss"
readme = "README.md"
requires-python = ">=3.11"          # tomllib, and dataclass slots
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "soxr>=0.3.7",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "typer>=0.9",
    "textual>=0.50",
]

[project.scripts]
fpsaudio = "fpsaudio.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fpsaudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:fpsaudio.*"]
