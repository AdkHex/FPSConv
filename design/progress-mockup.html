<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>FPSConv — Progress view mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f4f5f7; --bg2:#fafbfc; --card:#ffffff; --line:#e5e8ed; --line2:#d4d9e1; --line3:#b9c0cb;
  --tx:#171a1f; --tx2:#565f6c; --tx3:#9099a6;
  --ac:#3465e0; --ac-soft:#e9eefc; --ok:#178a52; --ok-soft:#e2f4ea; --warn:#b06a14; --warn-soft:#fdf1e0; --bad:#c33d3d; --bad-soft:#fbeaea;
  --ink:#16181d; --ink-tx:#fff; --hover:#f8f9fb; --sel:#eef2fc; --shadow:0 14px 40px rgba(23,26,31,.16);
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,Consolas,Menlo,monospace; color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0f1114; --bg2:#13161a; --card:#1a1d23; --line:#252930; --line2:#30353e; --line3:#3d434e;
  --tx:#e9ebef; --tx2:#a7aeb9; --tx3:#6b7280;
  --ac:#6c9bff; --ac-soft:#172139; --ok:#3ecf7a; --ok-soft:#12291c; --warn:#f0a44a; --warn-soft:#2b2113; --bad:#f0585a; --bad-soft:#2c181a;
  --ink:#e9ebef; --ink-tx:#101214; --hover:#15181d; --sel:#151c2c; --shadow:0 18px 48px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{flex:none}
.grow{flex:1}.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid var(--bg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ac)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* app shell (trimmed copy of the real UI, for context) */
.top{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center}.logo svg{color:var(--ink-tx)}
.chip{font:11px var(--mono);color:var(--tx3);padding:2.5px 8px;border:1px solid var(--line2);border-radius:999px;background:var(--bg)}
.bar-btn{height:32px;padding:0 10px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--tx2);display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.bar-btn.on,.bar-btn:hover{background:var(--hover);color:var(--tx);border-color:var(--line2)}.bar-btn svg{width:16px;height:16px}
.live{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ac);color:#fff;font:600 10px/16px var(--mono);text-align:center}
.setup{flex:none;display:flex;align-items:center;gap:4px;padding:12px 10px;border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;padding:3px;background:var(--card);gap:2px}
.seg button{height:28px;padding:0 9px;border:0;background:transparent;border-radius:7px;color:var(--tx2);font-size:12.5px;font-weight:500}.seg button.on{background:var(--ink);color:var(--ink-tx)}
.seg.small button{height:24px;font-size:12px}
.sep{width:1px;height:22px;background:var(--line2);margin:0 2px}
.ctl{height:34px;display:flex;align-items:center;gap:5px;padding:0 9px;background:var(--card);border:1px solid var(--line2);border-radius:9px;color:var(--tx2);font-size:11px;font-weight:500;white-space:nowrap}
.ctl b{color:var(--tx);font-size:12.5px;font-weight:500}.ctl.path .txt{font:12px var(--mono);color:var(--tx2)}
.switch{width:30px;height:18px;border-radius:999px;background:var(--ac);border:1px solid var(--ac);position:relative;display:inline-block}.switch::after{content:"";position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:#fff}
.qhead{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 0 25px;border-bottom:1px solid var(--line);background:var(--bg2)}
.qhead h1{font-size:14px;font-weight:600;margin:0 0 0 4px}.sum{color:var(--tx3);font-size:12.5px}
.btn{height:31px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line3)}.btn svg{width:14px;height:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-tx);font-weight:600}
.btn.danger{color:var(--bad)}.btn:disabled{opacity:.4;cursor:default}.btn.sm{height:26px;padding:0 10px;font-size:12px;border-radius:7px}
.cb{width:15px;height:15px;border:1.5px solid var(--line3);border-radius:4.5px;background:var(--card);appearance:none;margin:0}
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.queue{flex:1;min-height:0;display:flex;flex-direction:column}
.qbody{flex:1;min-height:0;overflow:auto;padding:8px 16px 20px}
.sec-h{height:30px;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin:6px -8px 4px;padding:0 8px}
.sec-h .cnt{font:600 10px var(--mono);background:var(--line);border-radius:999px;padding:1px 7px}
.trow{display:grid;grid-template-columns:26px minmax(200px,1.3fr) 190px minmax(150px,.9fr) 92px 108px;gap:12px;align-items:center;min-height:48px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:5px;cursor:pointer}
.trow:hover{border-color:var(--line3);background:var(--hover)}.trow.sel{border-color:var(--ac);background:var(--sel)}
.n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:7px}.s b{font-weight:500;color:var(--tx2)}.s .tr{margin-left:auto;font:500 11px var(--mono);color:var(--tx2)}
.plan{font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar2{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:2px;position:relative;transition:width .35s}
.bar2.running i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-100%);animation:shimmer 2.2s linear infinite}
.bar2.done i{background:var(--ok)}.bar2.wait i{width:100%;background:var(--line)}
.det{font:11px var(--mono);color:var(--tx3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.det .out{color:var(--ok)}
.st{font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--tx2)}.st i{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.st.running{color:var(--tx)}.st.running i{background:var(--ac);animation:pulse 1.6s ease-out infinite}.st.done{color:var(--tx)}.st.done i{background:var(--ok)}
.status{height:30px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--line);background:var(--card);font-size:12px;color:var(--tx3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);display:inline-block;margin-right:6px}.dot.ok{background:var(--ok)}

/* bottom activity panel */
.act{flex:none;height:304px;background:var(--card);display:flex;flex-direction:column;border-top:1px solid var(--line);position:relative}
.drag{height:6px;margin-bottom:-6px;cursor:ns-resize;position:relative;z-index:3}.drag::after{content:"";position:absolute;left:0;right:0;top:0;height:2px}.drag:hover::after{background:var(--ac)}
.act-h{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;align-self:stretch}
.tab{height:40px;padding:0 12px;border:0;background:transparent;color:var(--tx3);font-size:12.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}.tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-bottom-color:var(--ink)}
.act-h .sub{font:12px var(--mono);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-left:4px}
.ic{width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--tx3);display:inline-flex;align-items:center;justify-content:center}.ic:hover{background:var(--hover);color:var(--tx)}.ic svg{width:13px;height:13px}
.logv{flex:1;overflow:auto;padding:8px 14px 12px;font:12px/1.6 var(--mono);color:var(--tx2)}.logv .l{white-space:pre-wrap;word-break:break-all}.logv .t{color:var(--tx3)}

/* ── the Progress tab: one bar, one line of numbers, a plain stage list ── */
.prog{flex:1;min-height:0;overflow:auto;padding:14px 18px 14px;display:flex;flex-direction:column;gap:10px}
.prog>*{flex:none}
.p-files{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:13px}
.p-files .from{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.p-files .arr{color:var(--tx3);flex:none}
.p-files .to{font:12px var(--mono);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.p-files .to.ok{color:var(--ok)}
.p-files .meta{margin-left:auto;flex:none;font-size:12px;color:var(--tx3);white-space:nowrap}
.p-line{display:flex;align-items:baseline;gap:14px;font:12px var(--mono);color:var(--tx3);white-space:nowrap;min-width:0}
.p-line .pct{font-size:13px;font-weight:600;color:var(--tx);min-width:38px}
.p-line .pct.done{color:var(--ok)}.p-line .pct.failed{color:var(--bad)}
.p-line .now{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.p-line .right{margin-left:auto;flex:none}
.p-line .right b{color:var(--tx);font-weight:500}
.stages{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:18px auto 1fr;column-gap:10px;row-gap:5px;align-items:baseline;max-width:640px;font-size:12.5px}
.stages li{display:contents}
.stages .mk{width:18px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx3);font-size:11px}
.stages .mk svg{width:12px;height:12px}
.stages .nm{color:var(--tx3);white-space:nowrap}
.stages .tm{font:12px var(--mono);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stages li.done .nm{color:var(--tx2)}.stages li.done .mk{color:var(--ok)}
.stages li.skip .mk{color:var(--tx3)}
.stages li.running .nm{color:var(--tx);font-weight:500}.stages li.running .mk{color:var(--ac)}.stages li.running .tm{color:var(--tx2)}
.stages li.running .mk i{width:7px;height:7px;border-radius:50%;background:var(--ac);display:block;animation:pulse 1.6s ease-out infinite}
.stages li.failed .nm,.stages li.failed .tm,.stages li.failed .mk{color:var(--bad)}
.p-err{font:12px var(--mono);color:var(--bad);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.p-acts{display:flex;gap:6px;margin-top:4px}
.p-acts .btn.sm{height:26px}
/* mockup-only scenario switch, kept out of the way */
.demo{display:flex;gap:2px;align-items:center;font-size:12px;color:var(--tx3);margin-right:6px}
.demo span{margin-right:4px}
.demo button{height:24px;padding:0 7px;border-radius:6px;border:0;background:transparent;color:var(--tx3);font-size:12px}
.demo button.on{color:var(--tx);background:var(--hover);box-shadow:inset 0 0 0 1px var(--line2)}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ink-tx);padding:9px 16px;border-radius:9px;display:none;z-index:50;font-size:13px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M9.6 8.1v7.8l6.4-3.9z" fill="currentColor"/></svg></span>FPSConv<span class="chip">v1.1.22 · mockup</span></div>
  <div class="grow"></div>
  <button class="bar-btn on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg>Activity<span class="live">1</span></button>
  <button class="bar-btn" onclick="toggleTheme()" title="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="bar-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</header>

<div class="setup">
  <div class="seg"><button>FPS change</button><button class="on">Audio encode</button></div><div class="sep"></div>
  <div class="seg small"><button class="on">Single</button><button>Batch</button></div><div class="sep"></div>
  <div class="ctl"><b>DDP</b> ▾</div><div class="ctl">Channels <b>7.1</b> ▾</div><div class="ctl">Bitrate <b>1536k</b> ▾</div>
  <div class="ctl" style="border:0;background:transparent"><span class="switch"></span> Atmos</div>
  <div class="ctl">Layout <b>Flat 7.1</b> ▾</div><div class="ctl">DRC <b>film light</b> ▾</div>
  <div class="grow"></div><div class="ctl path"><span class="txt">H:\Ionic\Muxed\Dont_Touch</span></div><div class="ctl" style="width:32px;justify-content:center">⋯</div>
</div>



<div class="work">
  <section class="queue">
    <div class="qhead"><input type="checkbox" class="cb"><h1>Queue</h1><span class="sum" id="sum">1 running</span><div class="grow"></div>
      <button class="btn">Add files</button><button class="btn">Add folder</button><button class="btn ghost danger">Cancel</button><button class="btn primary" disabled>Start</button></div>
    <div class="qbody" id="qbody"></div>
  </section>

  <aside class="act">
    <div class="drag"></div>
    <div class="act-h">
      <div class="tabs"><button class="tab on" id="tab-prog" onclick="setTab('prog')">Progress</button><button class="tab" id="tab-job" onclick="setTab('job')">Job log</button><button class="tab" onclick="setTab('app')">App log</button></div>
      <span class="sub" id="act-sub"></span>
      <div class="grow"></div>
      <div class="demo"><span>mockup:</span><button class="on" data-sc="run" onclick="setScenario('run',this)">running</button><button data-sc="ddp" onclick="setScenario('ddp',this)">ddp 5.1</button><button data-sc="fps" onclick="setScenario('fps',this)">fps</button><button data-sc="done" onclick="setScenario('done',this)">done</button><button data-sc="fail" onclick="setScenario('fail',this)">failed</button></div>

    </div>
    <div class="prog" id="prog"></div>
    <div class="logv" id="logv" hidden></div>
  </aside>
</div>

<footer class="status"><span><i class="dot ok"></i>ffmpeg ready</span><span><i class="dot ok"></i>DEE ready</span><span><i class="dot ok"></i>Atmos ready · flat 7.1 ready</span><div class="grow"></div><span class="mono">→ H:\Ionic\Muxed\Dont_Touch</span></footer>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2500)}
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'}
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
const gb=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' KB';
const I={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  skip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 12h12"/></svg>'};

/* ── scenarios: what the real job would report ─────────────────────── */
const SRC={name:'The.Furious.2025.1080p.Blu-ray.x265.10bit.TrueHD.7.1.Atmos-HDS_Audio01.ENG.thd',meta:'TrueHD Atmos · 8 ch · 48 kHz · 2:03:07 · 5.4 GB',dur:7387};
const SCEN={
  run:{label:'DDP 7.1 Atmos flat 1536k',out:'The.Furious.2025.1080p.Blu-ray.x265.10bit.TrueHD.7.1.Atmos-HDS_Audio01.ENG_DDP7.1Atmos_1536k.ec3',
    // weight = share of the whole job (drives the big bar); the real app would learn these from history
    stages:[{n:'Extract TrueHD',w:0,skip:'source already .thd'},{n:'truehdd decode',w:.48,secs:760,sub:i=>gb(i*5.2e9)+' written'},{n:'DEE measure',w:.16,secs:250},{n:'DEE encode',w:.32,secs:510},{n:'Surround EX flag',w:.01,secs:6},{n:'Move to output',w:.03,secs:20}],
    live:{tool:'truehdd',lines:['truehdd: [INFO truehdd::cli::decode::progress] Counting frames for progress estimation','truehdd: truehdd decode  ·  {gb} written to temp  ·  {st} in this stage','patcher: DEE measure  42.0%  ·  {st} in this stage','patcher: DEE encode  {p}%  ·  {st} in this stage','patcher: Surround EX flag started','done in {el}: H:\\Ionic\\Muxed\\Dont_Touch\\…_DDP7.1Atmos_1536k.ec3 (1.42 GB)']},speed:8},
  ddp:{label:'DDP 5.1 1024k',out:'Concert.2024.DTS-HD.MA_DDP5.1_1024k.ec3',src:{name:'Concert.2024.BluRay.DTS-HD.MA.5.1.mka',meta:'DTS-HD MA · 6 ch · 48 kHz · 1:38:20 · 3.2 GB',dur:5900},
    stages:[{n:'Decode to WAV',w:.35,secs:140,sub:i=>'ffmpeg '+fmt(i*5900)+' / 1:38:20'},{n:'DEE measure',w:.2,secs:90},{n:'DEE encode',w:.42,secs:180},{n:'Move to output',w:.03,secs:5}],speed:20},
  fps:{label:'23.976 → 25',out:'Dune.Part2_23.976-25.ac3',src:{name:'Dune.Part2.ac3',meta:'AC-3 · 6 ch · 640 kbps · 2:45:49 · 759 MB',dur:9949},
    stages:[{n:'Decode + atempo',w:.5,secs:60,sub:i=>'ffmpeg '+fmt(i*9949)+' · 168x'},{n:'DEE encode',w:.47,secs:80,sub:i=>'deew '+fmt(i*9949)},{n:'Move to output',w:.03,secs:4}],speed:24},
  done:{label:'DDP 7.1 Atmos flat 1536k',out:'The.Furious.2025.1080p.Blu-ray.x265.10bit.TrueHD.7.1.Atmos-HDS_Audio01.ENG_DDP7.1Atmos_1536k.ec3',final:'done',size:'1.42 GB',
    stages:[{n:'Extract TrueHD',w:0,skip:'source already .thd'},{n:'truehdd decode',w:.48,secs:760},{n:'DEE measure',w:.16,secs:250},{n:'DEE encode',w:.32,secs:510},{n:'Surround EX flag',w:.01,secs:6},{n:'Move to output',w:.03,secs:20}]},
  fail:{label:'DDP 7.1 Atmos flat 1536k',out:'The.Furious.2025.1080p.Blu-ray.x265.10bit.TrueHD.7.1.Atmos-HDS_Audio01.ENG_DDP7.1Atmos_1536k.ec3',final:'failed',failAt:2,
    error:'dee.exe exited with code 3: the DLL hash does not match DEE 5.2.1-5994839 — flat 7.1 refused to run (Settings → 7.1 patcher)',
    stages:[{n:'Extract TrueHD',w:0,skip:'source already .thd'},{n:'truehdd decode',w:.48,secs:760},{n:'DEE measure',w:.16,secs:250},{n:'DEE encode',w:.32,secs:510},{n:'Surround EX flag',w:.01,secs:6},{n:'Move to output',w:.03,secs:20}]},
};
let sc='run', t=0, timer=null, tab='prog';

function model(){
  const S=SCEN[sc], src=S.src||SRC, st=S.stages.map(s=>({...s,state:'wait',pct:0,el:0}));
  let overall=0, cur=-1, elapsed=0, lastLine='';
  if(S.final==='done'){st.forEach(s=>{s.state=s.skip?'skip':'done';s.el=s.secs||0;elapsed+=s.el});overall=100}
  else if(S.final==='failed'){st.forEach((s,i)=>{if(s.skip){s.state='skip';return}if(i<S.failAt){s.state='done';s.el=s.secs;elapsed+=s.el}else if(i===S.failAt){s.state='failed';s.el=47;s.pct=31;elapsed+=47}});overall=st.slice(0,S.failAt).reduce((a,s)=>a+s.w,0)*100+st[S.failAt].w*31}
  else{
    let left=t*S.speed;                                   // simulated seconds elapsed
    st.forEach((s,i)=>{
      if(s.skip){s.state='skip';return}
      if(cur>=0)return;
      if(left>=s.secs){s.state='done';s.el=s.secs;left-=s.secs;elapsed+=s.secs;overall+=s.w*100}
      else{s.state='running';s.el=left;s.pct=left/s.secs*100;elapsed+=left;overall+=s.w*s.pct;cur=i}
    });
    if(cur<0){sc='done';return model()}
    const s=st[cur];
    lastLine=`${s.n.includes('truehdd')?'truehdd':s.n.includes('DEE')?'patcher':'ffmpeg'}: ${s.n}  ·  ${s.sub?s.sub(s.pct/100):s.pct.toFixed(1)+'%'}  ·  ${fmt(s.el)} in this stage`;
  }
  const total=st.reduce((a,s)=>a+(s.skip?0:s.secs||0),0);
  const eta=S.final?0:Math.max(0,total-elapsed);
  return {S,src,st,overall,cur,elapsed,eta,lastLine};
}

function renderProg(){
  const m=model(), S=m.S, final=S.final, cur=m.cur>=0?m.st[m.cur]:null, pct=Math.min(100,m.overall);
  $('act-sub').textContent='';
  const mark=s=>s.state==='done'?I.check:s.state==='failed'?I.x:s.state==='skip'?'–':s.state==='running'?'<i></i>':'';
  const time=s=>s.state==='done'?fmt(s.el):s.state==='skip'?`skipped — ${s.skip}`:s.state==='running'?`${fmt(s.el)}${s.sub?' · '+s.sub(s.pct/100):s.pct>0?' · '+s.pct.toFixed(0)+'%':''}`:s.state==='failed'?`failed after ${fmt(s.el)}`:'';
  const list=m.st.map(s=>`<li class="${s.state}"><span class="mk">${mark(s)}</span><span class="nm">${esc(s.n)}</span><span class="tm">${esc(time(s))}</span></li>`).join('');
  const to=final==='done'?`<span class="to ok" title="${esc(S.out)}">${esc(S.out)} · ${S.size}</span>`:`<span class="to" title="${esc(S.out)}">${esc(S.out)}</span>`;
  const now=final==='done'?'finished':final==='failed'?`stopped in ${esc(m.st[S.failAt].n)}`:esc(m.lastLine.replace(/^\w+: /,''));
  const right=final==='done'?`<b>${fmt(m.elapsed)}</b> total`:final==='failed'?`<b>${fmt(m.elapsed)}</b> elapsed`:`<b>${fmt(m.elapsed)}</b> elapsed · <b>${fmt(m.eta)}</b> left`;
  const tail=final==='failed'?`<div class="p-err">${esc(S.error)}</div>`:'';
  $('prog').innerHTML=`
    <div class="p-files"><span class="from" title="${esc(m.src.name)}">${esc(m.src.name)}</span><span class="arr">→</span>${to}<span class="meta">${esc(m.src.meta)}</span></div>
    <div class="p-line"><span class="pct ${final||''}">${Math.round(pct)}%</span><span class="now">${now}</span><span class="right">${right}</span></div>
    <ul class="stages">${list}</ul>${tail}`;
  renderQueue(m);
}
function renderQueue(m){
  const S=m.S, final=S.final, cur=m.cur>=0?m.st[m.cur]:null, pct=Math.min(100,m.overall);
  const det=final==='done'?`→ <span class="out">${esc(S.out)}</span> · ${S.size} · ${fmt(m.elapsed)}`:final==='failed'?`<span style="color:var(--bad)">${esc(S.error)}</span>`:`${Math.round(pct)}% · ${esc(cur.n)} · ${fmt(m.elapsed)} · ~${fmt(m.eta)} left`;
  $('qbody').innerHTML=`<div class="sec-h">${final?'Finished':'Running'}<span class="cnt">1</span></div>
    <div class="trow sel"><input type="checkbox" class="cb"><div style="min-width:0"><div class="n">${esc(m.src.name)}</div><div class="s"><b>${esc(m.src.meta.split(' · ')[0])}</b> · ${esc(m.src.meta.split(' · ').slice(1,3).join(' · '))}<span class="tr">#0</span></div></div>
    <div><span class="plan">${esc(S.label)}</span></div><div><div class="bar2 ${final||'running'}"><i style="width:${pct}%"></i></div><div class="det">${det}</div></div><div class="st ${final||'running'}"><i></i>${final==='done'?'Done':final==='failed'?'Failed':'Running'}</div><div></div></div>
    <div class="sec-h" style="margin-top:10px">Ready<span class="cnt">1</span></div>
    <div class="trow"><input type="checkbox" class="cb"><div style="min-width:0"><div class="n">Oppenheimer.2023.UHD.TrueHD.7.1.Atmos.mka</div><div class="s"><b>TrueHD Atmos</b> · 8 ch · 48 kHz<span class="tr">#0</span></div></div><div><span class="plan">DDP 7.1 Atmos flat 1536k</span></div><div><div class="bar2 wait"><i></i></div><div class="det">waiting for Start</div></div><div class="st"><i></i>Ready</div><div></div></div>`;
  $('sum').textContent=final?'1 ready · 1 finished':'1 ready · 1 running';
}
function renderLog(){
  const m=model();
  $('logv').innerHTML=['plan: 1/5 ffmpeg copies the TrueHD Atmos stream unchanged into a .thd in the temp folder (no decode)','plan: 2/5 truehdd decodes the bed and the Atmos objects into a Dolby Atmos master (DAMF) — the slow step','plan: 3/5 the DD+ 7.1 patcher backs up DEE\'s dee_audio_filter_ddp_atmos.dll, applies the validated flat-7.1 patch and runs DEE','plan: 4/5 the Surround EX flag patcher sets dsurexmod=2 in the AC-3 core','plan: 5/5 the .ec3 is moved to the output folder, temp deleted','truehdd decode (2/5): $ C:\\Program Files\\TrueHDD\\truehdd.EXE --progress decode --output-path …\\master --warp-mode normal --bed-conform …',m.lastLine||'done'].map((l,i)=>`<div class="l"><span class="t">09:0${2+Math.floor(i/3)}:${String(48+i).padStart(2,'0')}</span>  ${esc(l)}</div>`).join('');
}
function setTab(x){tab=x;$('tab-prog').classList.toggle('on',x==='prog');$('tab-job').classList.toggle('on',x==='job');document.querySelectorAll('.tabs .tab')[2].classList.toggle('on',x==='app');$('prog').hidden=x!=='prog';$('logv').hidden=x==='prog';if(x!=='prog')renderLog()}
function setScenario(k,btn){sc=k;t=0;document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b===btn));setTab('prog');renderProg()}
function tick(){if(!SCEN[sc].final){t+=1;if(tab==='prog')renderProg();else renderLog()}}
renderProg();setInterval(tick,1000);
</script>
