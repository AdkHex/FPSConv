name: Build & release (Windows)

# Every push to main = tests → PyInstaller → Inno Setup installer → GitHub Release.
# The version is MAJOR.MINOR from the VERSION file plus the run number, so each
# push produces a strictly increasing version and the installed app updates itself.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  build:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compute version
        id: ver
        shell: bash
        run: |
          base=$(tr -d ' \r\n' < VERSION)
          version="${base}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '# Generated by the release workflow.\n__version__ = "%s"\n' "$version" > fpsconv/_version.py
          echo "Building FPSConv $version"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Tests (Windows, with deew present)
        run: python -m unittest -v

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/FPSConv.spec

      - name: Smoke-test the frozen build
        shell: bash
        run: |
          ./dist/FPSConv/fpsconv-cli.exe --version
          ./dist/FPSConv/fpsconv-cli.exe doctor || true
          ./dist/FPSConv/fpsconv-cli.exe deew --version

      - name: Inno Setup
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Release manifest
        id: manifest
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          file="dist/FPSConv-Setup-$v.exe"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          size=$(stat -c%s "$file")
          notes=$(git log -1 --pretty=%s)
          python - "$v" "$file" "$sha" "$size" "$notes" <<'PY'
          import json, sys, datetime
          v, file, sha, size, notes = sys.argv[1:]
          name = file.split("/")[-1]
          json.dump({
              "version": v,
              "url": f"https://github.com/${{ github.repository }}/releases/download/v{v}/{name}",
              "sha256": sha,
              "size": int(size),
              "notes": notes,
              "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, open("dist/latest.json", "w"), indent=2)
          PY
          echo "$sha  $(basename "$file")" > dist/SHA256SUMS.txt
          cat dist/latest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSConv-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/FPSConv-Setup-*.exe
            dist/latest.json
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" \
            --title "FPSConv $v" \
            --notes "$(git log -1 --pretty='%s%n%n%b')" \
            "dist/FPSConv-Setup-$v.exe" dist/latest.json dist/SHA256SUMS.txt
